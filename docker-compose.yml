version: "3.8"

services:
  api:
    build: ./api
    container_name: mcp-tester-api
    restart: unless-stopped
    ports:
      - "5174:5174"
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      - ENABLE_OLLAMA=true
      - PORT=5174
    volumes:
      - ./api/src:/usr/src/app/src
    networks:
      - appnet

  web:
    build: ./web
    container_name: mcp-tester-web
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - api
    environment:
      - API_URL=http://localhost:5174
    networks:
      - appnet

volumes:
  ollama_data:

networks:
  appnet:
    driver: bridge
