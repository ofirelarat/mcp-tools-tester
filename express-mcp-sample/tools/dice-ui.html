<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎲 Dice Roller</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 40px;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 20px;
      color: #333;
    }

    .dice-input {
      margin: 20px 0;
    }

    label {
      display: block;
      font-weight: 600;
      color: #555;
      margin-bottom: 10px;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input {
      flex: 1;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 1em;
      font-weight: 600;
      transition: border-color 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
    }

    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 1em;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .result {
      margin-top: 30px;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 12px;
      min-height: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .result.hidden {
      display: none;
    }

    .dice-animation {
      font-size: 4em;
      animation: spin 0.5s ease-out;
      margin-bottom: 10px;
    }

    @keyframes spin {
      0% {
        transform: rotateZ(0deg) scale(0.8);
      }
      50% {
        transform: rotateZ(180deg) scale(1.2);
      }
      100% {
        transform: rotateZ(360deg) scale(1);
      }
    }

    .roll-value {
      font-size: 2.5em;
      font-weight: 700;
      color: #667eea;
      margin: 10px 0;
    }

    .roll-text {
      color: #666;
      font-size: 1em;
    }

    .loading {
      display: none;
    }

    .loading.active {
      display: inline-block;
    }

    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      animation: spin-spinner 1s linear infinite;
      display: inline-block;
    }

    @keyframes spin-spinner {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎲</h1>
    <h2>Dice Roller</h2>

    <div class="dice-input">
      <label for="sides">Number of Sides:</label>
      <div class="input-group">
        <input
          id="sides"
          type="number"
          min="2"
          max="100"
          value="6"
          placeholder="Enter number of sides"
        />
        <button id="rollBtn" onclick="rollDice()">Roll</button>
      </div>
    </div>

    <div id="result" class="result hidden">
      <div class="dice-animation" id="diceEmoji">🎲</div>
      <div class="roll-value" id="rollValue">-</div>
      <div class="roll-text" id="rollText">-</div>
    </div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
    </div>
  </div>

  <script type="module">
    import { App, PostMessageTransport, applyDocumentTheme } from "@modelcontextprotocol/ext-apps";

    const app = new App({ name: "Dice Roller", version: "1.0.0" });

    const rollBtn = document.getElementById("rollBtn");
    const sidesInput = document.getElementById("sides");
    const resultDiv = document.getElementById("result");
    const diceEmoji = document.getElementById("diceEmoji");
    const rollValue = document.getElementById("rollValue");
    const rollText = document.getElementById("rollText");
    const loading = document.getElementById("loading");

    window.rollDice = function() {
      const sides = parseInt(sidesInput.value) || 6;
      if (sides < 2 || sides > 100) {
        alert("Sides must be between 2 and 100");
        return;
      }

      resultDiv.classList.add("hidden");
      loading.classList.add("active");
      rollBtn.disabled = true;
    };

    // Handle incoming tool input from the MCP framework
    app.ontoolinput = (params) => {
      const sides = params.arguments?.sides || 6;
      sidesInput.value = sides;
      window.rollDice();
    };

    // Handle tool result - displays the dice roll outcome
    app.ontoolresult = (result) => {
      loading.classList.remove("active");
      rollBtn.disabled = false;

      if (result?.content?.[0]?.text) {
        const text = result.content[0].text;
        const structured = result?.structuredContent || {};
        const roll = structured.roll || 0;
        const sides = structured.sides || 6;

        // Animate to final value
        setTimeout(() => {
          diceEmoji.textContent = "✅";
          rollValue.textContent = roll;
          rollText.textContent = `d${sides}: ${roll}`;
          resultDiv.classList.remove("hidden");
        }, 300);
      }
    };

    // Apply host theme and styling
    app.onhostcontextchanged = (ctx) => {
      if (ctx?.theme) {
        applyDocumentTheme(ctx.theme);
      }
      if (ctx?.safeAreaInsets) {
        const { top, right, bottom, left } = ctx.safeAreaInsets;
        document.body.style.padding = `${top}px ${right}px ${bottom}px ${left}px`;
      }
    };

    app.onteardown = async () => {
      return {};
    };

    await app.connect(new PostMessageTransport());
  </script>
</body>
</html>
